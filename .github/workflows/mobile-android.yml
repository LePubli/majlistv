# Fabrique l'APK Android de l'application Mejliss TV (dossier mobile/) sur les serveurs de GitHub.
# Lancement : à chaque push sur main qui touche mobile/, ou à la main (Actions → « Application Android (APK) » → Run workflow).
# Résultat : un fichier « mejliss-tv-android » téléchargeable en bas de la page de l'exécution (conservé 30 jours).
# L'APK est signé avec la clé de test d'Android : installable directement sur un téléphone, mais PAS publiable sur Google Play
# (la clé de publication sera créée à l'étape « magasins »).
name: Application Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (typage + tests)
        run: npm run check

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK (arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Nommer l'APK
        id: name
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="mejliss-tv-${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "file=mobile/$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: mejliss-tv-android
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 30
