# Test en LOCAL uniquement (PostgreSQL + API). Non utilisé par DockPanel Git Deploy.
# Lancement depuis ce dossier : docker compose --env-file ../.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-majlis}
      POSTGRES_USER: ${POSTGRES_USER:-majlis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Majlis TV}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-majlis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-majlis}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_URL: ${WEB_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      PREVIEW_SECONDS: ${PREVIEW_SECONDS:-120}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

volumes:
  db_data:
